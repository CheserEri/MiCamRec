[project]
name = "micamrec"
version = "0.1.0"
description = "MiCamRec：轻量小米摄像头录像服务（CLI + TUI）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
micam-rec = "micamrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micamrec"]
